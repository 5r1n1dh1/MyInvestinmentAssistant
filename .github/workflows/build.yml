# Builds and verifies the project on every push and pull request.
#
# Three jobs (planv2 W8):
#
#   1. `changes` detects what a pull request touches. A push to main always
#      builds everything; a PR that only edits :domain/:data/docs skips the
#      Android job, so engine-only changes are verified in ~3 minutes instead
#      of waiting for an SDK install and an APK build.
#   2. `jvm` runs the pure-JVM engine suites. They need no Android SDK, so
#      they are the cheapest signal available and do not depend on the SDK
#      install succeeding.
#   3. `android` installs the SDK, compiles :app and :android-data — the
#      modules that had never been compiled before CI did (see
#      docs/VERIFICATION.md) — and uploads the APK.
#
# Release signing is optional, by design (plan.md G1: no keys, no cost): with
# no upload keystore configured, the release build is signed with the debug
# key and still installs.

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

# A superseded run on the same ref is cancelled rather than queued. Two APKs
# from the same commit is pure waste, and on a branch with rapid pushes the
# queue grows faster than it drains.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What did this event change? Pushes and manual runs always build the APK;
  # a pull request builds it only when an Android module or the build itself
  # changed. Detected with plain git so no third-party action is involved.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch origin "$BASE" --depth=1
            # Two-dot diff, not three-dot: the checkout is a depth-1
            # shallow clone of the PR merge commit, which shares no
            # history with the freshly fetched base ref, so a
            # three-dot diff fails with "no merge base". The merge
            # commit's tree IS the base tree plus the PR's changes,
            # so a plain tree-to-tree diff lists exactly the PR's
            # changed paths.
            if git diff --name-only "origin/${BASE}" HEAD \
                | grep -qE '^(app/|android-data/|gradle/|\.github/workflows/)|^build\.gradle\.kts$|^settings\.gradle\.kts$'; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
          echo "event: ${{ github.event_name }}"

  # The engine's JVM tests need no Android SDK, so they run first and fail
  # fast: on a broken parser or detector this job fails in ~1 minute instead
  # of after a full SDK download, and it is the part of the build that has
  # actually been run before (docs/VERIFICATION.md).
  #
  # `-PskipAndroid` is REQUIRED here, not an optimisation. GitHub-hosted runners
  # pre-set ANDROID_SDK_ROOT, so settings.gradle.kts's SDK check evaluated true,
  # :app and :android-data were included, and AGP was applied during this step.
  # It then failed on an AGP/Gradle incompatibility before any engine test
  # ran. Passing -PskipAndroid makes the claim in the paragraph above actually
  # true.
  jvm:
    name: JVM engine suites (:domain, :data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # This MUST stay the first step that touches ./gradlew.
      #
      # Bug it fixes: the chmod used to live ~16 lines *below* the JVM-test
      # step. So the very first `./gradlew` call ran against a non-executable
      # wrapper and failed with `shell: ./gradlew: Permission denied` before
      # this step ever ran. The chmod was load-bearing but positioned after its
      # own first caller, so it could never prevent the failure it was written
      # to prevent.
      #
      # Belt-and-braces by design: .gitattributes pins `gradlew` to mode 100755
      # and the index records 100755, so the wrapper should already be
      # executable. This step is what makes the build survive a checkout that
      # lost the bit anyway (filesystem without mode preservation, or a clone
      # made with core.fileMode=false). Do not move any ./gradlew call above this.
      - name: Ensure gradlew is executable
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root. The Gradle wrapper must be committed."
            exit 1
          fi
          # Fix the exec bit in the index too, not just on disk, so it survives
          # to the next commit.
          chmod +x gradlew
          git update-index --chmod=+x gradlew 2>/dev/null || true
          # Re-read the mode rather than trusting `chmod`; a noexec or
          # core.fileMode=false checkout can leave this looking right in `ls`
          # while the kernel still refuses exec.
          if [ ! -x ./gradlew ]; then
            echo "::error::./gradlew is still not executable after chmod. Running it via 'sh ./gradlew'."
          fi
          ls -l gradlew

      # Proves the wrapper actually runs. `./gradlew --version` is the cheapest
      # possible execution test: if this passes, every later ./gradlew call
      # will at least get past exec.
      - name: Verify Gradle wrapper runs
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --version
          else
            echo "Exec bit unavailable; invoking through sh."
            sh ./gradlew --version
          fi

      - name: Run pure-JVM test suites
        run: ./gradlew :domain:test :data:test -PskipAndroid --no-daemon --stacktrace

  # CHANGE 2 (this repo only): `settings.gradle.kts` includes :android-data
  # and :app ONLY when an SDK is detectable, so one must exist before ANY
  # Gradle task that touches them.
  #
  # The `android-actions/setup-android` action is deliberately NOT used: its
  # `tools` package install fails on current runners (the standalone SDK
  # "tools" package was removed from Google's repository, and the action's
  # pinned cmdline-tools revision then exits 1 before any module compiles).
  # The runner image ships a working sdkmanager, but NOT on the default
  # PATH — it lives at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin — so it is
  # resolved by path. Failures on the package install are loud on purpose:
  # a swallowed SDK install only surfaces later as a confusing Gradle error.
  android:
    name: Build & Package APK
    needs: [changes, jvm]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nothing here needs elevated permissions.
    permissions:
      contents: read

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure gradlew is executable
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root. The Gradle wrapper must be committed."
            exit 1
          fi
          chmod +x gradlew
          git update-index --chmod=+x gradlew 2>/dev/null || true
          if [ ! -x ./gradlew ]; then
            echo "::error::./gradlew is still not executable after chmod. Running it via 'sh ./gradlew'."
          fi
          ls -l gradlew

      - name: Verify Gradle wrapper runs
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --version
          else
            echo "Exec bit unavailable; invoking through sh."
            sh ./gradlew --version
          fi

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          # Resolve the runner's preinstalled sdkmanager. It lives under
          # cmdline-tools/latest/bin and is NOT on the default PATH, so a
          # bare `sdkmanager` fails with exit 127.
          SDKMGR="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under ${ANDROID_SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          # Accept licences. Tolerant: a licence prompt that fails should not
          # block a build that may not need a new package.
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # Install exactly what AGP 8.13 / compileSdk 36 needs. NOT tolerant:
          # a missing package must fail the run now, with this step's name on it.
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          ls "${ANDROID_SDK_ROOT}"

      - name: Verify wrapper and toolchain
        run: ./gradlew --version

      - name: Prepare Environment Files and Keystore
        run: |
          # Some Gradle plugins read a .env file and fail when it is absent.
          if [ ! -f .env ]; then
            touch .env
            echo "Created empty .env file"
          fi

          # A debug keystore, for the debug variant and as the fallback signing
          # config for `release` when no upload key is configured.
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "debug.keystore not found. Generating standard Android debug keystore with keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -l debug.keystore

      # The upload keystore is OPTIONAL. plan.md G1 makes this app free to
      # build with no secrets, so a repository with no keystore configured
      # must still produce a working APK — `app/build.gradle.kts` falls back
      # to the debug signing config in that case.
      - name: Setup Release Keystore (Optional)
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks" || true
          fi

          if [ -s "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            echo "Upload keystore decoded."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "No upload keystore configured — release will be signed with the debug key."
            echo "That is expected and is not a failure (plan.md G1: no keys, no cost)."
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

      - name: Decide which variants to build
        id: variants
        run: |
          case "${{ github.event.inputs.build_type || 'debug' }}" in
            release)  echo "targets=assembleRelease"     >> $GITHUB_OUTPUT ;;
            both)     echo "targets=assembleDebug assembleRelease" >> $GITHUB_OUTPUT ;;
            *)        echo "targets=assembleDebug"       >> $GITHUB_OUTPUT ;;
          esac
          echo "Building: ${{ steps.variants.outputs.targets }}"

      - name: Build APK
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          ./gradlew ${{ steps.variants.outputs.targets }} --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      # Find *every* produced APK and record the list, rather than assuming one
      # path. `assembleDebug assembleRelease` writes to two directories, and a
      # step that assumed a single path would zip half the output.
      - name: Collect built APKs
        id: apks
        run: |
          FOUND=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | sort)
          if [ -z "$FOUND" ]; then
            echo "No APK was produced — the build step should have failed first." >&2
            exit 1
          fi
          echo "APK list:"
          echo "$FOUND"
          echo "$FOUND" > apk-list.txt
          COUNT=$(echo "$FOUND" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Zip APKs
        run: |
          # A bare .apk cannot always be downloaded from the Actions UI, so it
          # is also zipped. Both the raw APK and the zip are uploaded.
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            zip -j "$(dirname "$apk")/$(basename "$apk" .apk).apk.zip" "$apk"
            echo "Zipped: $(basename "$apk").apk.zip"
          done < apk-list.txt

      # `apksigner verify` is the only honest way to state whether the
      # artifact is signed and with which key. It is allowed to fail the build
      # only in the unsigned case, which cannot happen: app/build.gradle.kts
      # always supplies a signing config.
      - name: Verify signing of the release APK
        run: |
          REL=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$REL" ]; then
            echo "No release APK (debug-only build)." && exit 0
          fi
          echo "Verifying: $REL"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$REL" | head -20

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mia-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            gradle-build.log
            **/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Summarise
        if: always()
        run: |
          echo "### Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| JVM tests | domain + data |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | debug keystore, or upload key if configured |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the run summary." >> $GITHUB_STEP_SUMMARY
