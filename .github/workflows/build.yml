# Builds the Android APK on every push and pull request.
#
# Modelled on the reference workflow at
# /home/srinidhi/Documents/Google_AI_Studio/Niagara_clone/.github/workflows/build.yml, with four
# changes this project needs. Each is called out at the step that implements it, because every one
# of them is a difference a reviewer should be able to check.
#
#   1. The pure-JVM test suites run first. This repo's engine (932 domain tests + 487 data tests)
#      needs no Android SDK, so it is the cheapest signal available and it does not depend on the
#      SDK install succeeding.
#   2. The Android SDK is installed explicitly. Gradle's `com.android.*` plugins cannot resolve
#      without one, and the reference workflow relies on the runner image's SDK rather than
#      declaring a dependency on it.
#   3. Release signing is optional, by design (plan.md G1: no keys, no cost). The reference
#      workflow's debug keystore generation is kept because `assembleRelease` needs *a* signing
#      config, but a missing upload keystore no longer fails the build.
#   4. The APK is zipped before upload, because a bare `.apk` is not downloadable from the
#      GitHub Actions UI on some browsers.

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

# A superseded run on the same ref is cancelled rather than queued. Two APKs from the same commit
# is pure waste on a self-hosted runner, and on a branch with rapid pushes the queue grows faster
# than it drains.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    # Nothing here needs elevated permissions.
    permissions:
      contents: read

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # - name: Setup Gradle
      #   uses: gradle/actions/setup-gradle@v4
      #   with:
      #     gradle-version: '9.8.0'

      # This MUST stay the first step that touches ./gradlew.
      #
      # Bug it fixes: the chmod used to live in the "Ensure gradlew executable" step, ~16 lines
      # *below* the JVM-test step. So the very first `./gradlew` call ran against a non-executable
      # wrapper and failed with:
      #     shell: ./gradlew: Permission denied
      # before this step ever ran. The chmod was load-bearing but positioned after its own
      # first caller, so it could never prevent the failure it was written to prevent.
      #
      # Belt-and-braces by design: .gitattributes now pins `gradlew` to mode 100755 and the index
      # records 100755, so the wrapper should already be executable. This step is what makes the
      # build survive a checkout that lost the bit anyway (filesystem without mode preservation,
      # or a clone made with core.fileMode=false). Do not move any ./gradlew call above this.
      - name: Ensure gradlew is executable
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root. The Gradle wrapper must be committed."
            exit 1
          fi
          # Fix the exec bit in the index too, not just on disk, so it survives to the next commit.
          chmod +x gradlew
          git update-index --chmod=+x gradlew 2>/dev/null || true
          # Re-read the mode rather than trusting `chmod`; a noexec or core.fileMode=false
          # checkout can leave this looking right in `ls` while the kernel still refuses exec.
          if [ ! -x ./gradlew ]; then
            echo "::error::./gradlew is still not executable after chmod. Running it via 'sh ./gradlew'."
          fi
          ls -l gradlew

      # Proves the wrapper actually runs. `./gradlew --version` is the cheapest possible
      # execution test: if this passes, every later ./gradlew call will at least get past exec.
      - name: Verify Gradle wrapper runs
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --version
          else
            echo "Exec bit unavailable; invoking through sh."
            sh ./gradlew --version
          fi

      # CHANGE 1 (this repo only): the engine's JVM tests need no Android SDK, so they run
      # before the SDK install and fail fast. On a broken parser or detector this step fails in
      # ~1 minute instead of after a full SDK download, and it is the part of the build that has
      # actually been run before (docs/VERIFICATION.md).
      #
      # `-PskipAndroid` is REQUIRED here, not an optimisation. GitHub-hosted runners
      # pre-set ANDROID_SDK_ROOT, so settings.gradle.kts's SDK check evaluated true, :app and
      # :android-data were included, and AGP was applied during this step. It then failed with:
      #     Plugin 'com.android.internal.library' relies on
      #     'org.gradle.api.problems.internal.InternalProblems', a Gradle internal API that was
      #     removed in Gradle 9.6.0
      # before any engine test ran. Passing -PskipAndroid makes the claim in the paragraph above
      # actually true.
      - name: Run pure-JVM test suites
        run: ./gradlew :domain:test :data:test -PskipAndroid --no-daemon --stacktrace

      # CHANGE 2 (this repo only): `settings.gradle.kts` includes :android-data and :app ONLY when
      # an SDK is detectable, so one must exist before ANY Gradle task that touches them. Detected
      # via `local.properties`, which AGP reads; writing it here is what flips those modules into
      # the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

      # NOTE: the "Ensure gradlew executable" step that used to live here has moved ABOVE the
      # first ./gradlew call. It ran too late to prevent "Permission denied". The chmod is now
      # performed in "Ensure gradlew is executable", immediately after checkout.

      # CHANGE 3 (this repo only): pins the wrapper distribution rather than relying on whatever
      # `gradle` the runner image ships. The committed wrapper says Gradle 9.8.0, and a bare
      # `gradle wrapper` (which passes `--gradle-version 9.3.1`) would silently rewrite the project
      # to a *different* Gradle than the one the build was written against. Regenerating the
      # wrapper is therefore a last resort, not a shortcut.
      - name: Verify wrapper and toolchain
        run: |
          ./gradlew --version

      - name: Prepare Environment Files and Keystore
        run: |
          # Some Gradle plugins read a .env file and fail when it is absent.
          if [ ! -f .env ]; then
            touch .env
            echo "Created empty .env file"
          fi

          # A debug keystore, for the debug variant and as the fallback signing config for
          # `release` when no upload key is configured.
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "debug.keystore not found. Generating standard Android debug keystore with keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -l debug.keystore

      # CHANGE 3b (this repo only): the upload keystore is OPTIONAL. plan.md G1 makes this app free
      # to build with no secrets, so a repository with no keystore configured must still produce a
      # working APK — `app/build.gradle.kts` falls back to the debug signing config in that case.
      # The reference workflow treats the keystore as expected and `|| true` hides the decode
      # failure instead.
      - name: Setup Release Keystore (Optional)
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks" || true
          fi

          if [ -s "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            echo "Upload keystore decoded."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "No upload keystore configured — release will be signed with the debug key."
            echo "That is expected and is not a failure (plan.md G1: no keys, no cost)."
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

      - name: Decide which variants to build
        id: variants
        run: |
          case "${{ github.event.inputs.build_type || 'release' }}" in
            debug)  echo "targets=assembleDebug"       >> $GITHUB_OUTPUT ;;
            both)   echo "targets=assembleDebug assembleRelease" >> $GITHUB_OUTPUT ;;
            *)      echo "targets=assembleRelease"     >> $GITHUB_OUTPUT ;;
          esac
          echo "Building: ${{ steps.variants.outputs.targets }}"

      - name: Build APK
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          ./gradlew ${{ steps.variants.outputs.targets }} --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      # CHANGE 4 (this repo only): find *every* produced APK and record the list, rather than
      # assuming one path. `assembleDebug assembleRelease` writes to two directories, and a
      # step that assumed a single path would zip half the output.
      - name: Collect built APKs
        id: apks
        run: |
          FOUND=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | sort)
          if [ -z "$FOUND" ]; then
            echo "No APK was produced — the build step should have failed first." >&2
            exit 1
          fi
          echo "APK list:"
          echo "$FOUND"
          echo "$FOUND" > apk-list.txt
          COUNT=$(echo "$FOUND" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Zip APKs
        run: |
          # A bare .apk cannot always be downloaded from the Actions UI, so it is also zipped.
          # Both the raw APK and the zip are uploaded.
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            zip -j "$(dirname "$apk")/$(basename "$apk" .apk).apk.zip" "$apk"
            echo "Zipped: $(basename "$apk").apk.zip"
          done < apk-list.txt

      - name: Verify signing of the release APK
        run: |
          # `apksigner verify` is the only honest way to state whether the artifact is signed and
          # with which key. It is allowed to fail the build only in the unsigned case, which cannot
          # happen: app/build.gradle.kts always supplies a signing config.
          REL=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$REL" ]; then
            echo "No release APK (debug-only build)." && exit 0
          fi
          echo "Verifying: $REL"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$REL" | head -20

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mia-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            gradle-build.log
            **/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Summarise
        if: always()
        run: |
          echo "### Build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| JVM tests | domain + data |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | debug keystore, or upload key if configured |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the run summary. \`:android-data\` and \`:app\`" >> $GITHUB_STEP_SUMMARY
          echo "have never been compiled outside CI — see docs/VERIFICATION.md." >> $GITHUB_STEP_SUMMARY
