# Live source probes — on-demand only (planv2 W8, owner decision: no cron).
#
# Probes every free data source the app depends on, from GitHub's
# network, and writes a markdown report (step summary + artifact).
# The report drives the Class-B decisions in planv2:
#
#   * W3  — does any NSE index-history URL answer 200? (relative
#           strength needs an index series; breadth does not)
#   * W4  — does screener.in's HDFCBANK page publish NIM / GNPA /
#           CASA / PCR rows today? (decides whether those RatioIds
#           promote from NOT_SOURCED to AVAILABLE)
#   * W4  — do corporate-action / bulk-deal / surveillance endpoints
#           answer from the archives host?
#   * W3  — does the Yahoo cookie+crumb handshake answer, or 429?
#
# robots.txt compliance (binding, plan.md §3.6): only the permitted
# screener.in URL shape is fetched — /company/{SYMBOL}/consolidated/,
# one request, with the required Referer. No search, no pagination.
# NSE endpoints are read-only GETs of published archives.

name: Live source probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe free data sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run probes and build the report
        run: |
          set -uo pipefail
          REPORT="$RUNNER_TEMP/live-probe-report.md"
          YESTERDAY="$(date -u -d '1 day ago' +%Y%m%d)"
          YESTERDAY_DMY="$(date -u -d '1 day ago' +%d%m%Y)"

          {
            echo "# Live source probe — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Run: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo
            echo "Every endpoint the app depends on, probed from GitHub's network."
            echo "A probe failing from here is a **finding about this network**, not"
            echo "about the source — the app's own fallbacks are documented in"
            echo "docs/DATA-NOTES.md."
            echo
          } > "$REPORT"

          probe_row() {
            # probe_row "name" "url" [curl args...]
            local name="$1"; local url="$2"; shift 2
            local result
            result="$(curl -sS -o /dev/null -w '%{http_code} · %{size_download} bytes · %{time_total}s' \
                      --max-time 60 "$@" "$url" 2>&1)" || result="curl failed: $result"
            echo "| $name | \`$url\` | $result |" >> "$REPORT"
          }

          echo "## 1. NSE EOD price layer" >> "$REPORT"
          echo >> "$REPORT"
          echo "| Source | URL | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"
          probe_row "Bhavcopy — archives mirror (primary in app)" \
            "https://archives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_${YESTERDAY}_F_0000.csv.zip"
          probe_row "Bhavcopy — nsearchives (documented primary)" \
            "https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_${YESTERDAY}_F_0000.csv.zip"
          probe_row "Symbol master (EQUITY_L)" \
            "https://archives.nseindia.com/content/equities/EQUITY_L.csv"
          probe_row "Legacy delivery file (DELIV_PER)" \
            "https://archives.nseindia.com/products/content/sec_bhavdata_full_${YESTERDAY_DMY}.csv"

          echo >> "$REPORT"
          echo "## 2. Index history (candidates — W3 needs one that answers 200)" >> "$REPORT"
          echo >> "$REPORT"
          echo "| Candidate | URL | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"
          probe_row "indices/ind_close_all (archives)" \
            "https://archives.nseindia.com/content/indices/ind_close_all_${YESTERDAY}.csv"
          probe_row "indices/ind_close_all (nsearchives)" \
            "https://nsearchives.nseindia.com/content/indices/ind_close_all_${YESTERDAY}.csv"
          probe_row "indices historical (products path)" \
            "https://archives.nseindia.com/products/content/equities/indices/ind_close_all_${YESTERDAY}.csv"

          echo >> "$REPORT"
          echo "## 3. Corporate events (candidates — W4)" >> "$REPORT"
          echo >> "$REPORT"
          echo "| Candidate | URL | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"
          probe_row "Corporate announcements archive" \
            "https://archives.nseindia.com/content/equities/corporate/announcements.csv"
          probe_row "Bulk deals archive" \
            "https://archives.nseindia.com/content/equities/bulkdeals.csv"
          probe_row "Block deals archive" \
            "https://archives.nseindia.com/content/equities/blockdeals.csv"
          probe_row "ASM list (www host)" \
            "https://www.nseindia.com/content/equities/equity_advisory.htm"
          probe_row "GSM list (www host)" \
            "https://www.nseindia.com/content/equities/gsm_equity.htm"

          echo >> "$REPORT"
          echo "## 4. Yahoo Finance handshake (W3 history backfill)" >> "$REPORT"
          echo >> "$REPORT"
          echo "| Step | URL | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"
          # Step 1: fc.yahoo.com sets the session cookie (a 404 with a
          # Set-Cookie is the expected, documented answer).
          COOKIE_JAR="$RUNNER_TEMP/yahoo_cookies.txt"
          probe_row "fc.yahoo.com (cookie seed; 404 + cookie is the good case)" \
            "https://fc.yahoo.com" -c "$COOKIE_JAR" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
          # Step 2: getcrumb with the cookie. Guarded: the runner
          # invokes this script with `bash -e`, so an unguarded
          # command substitution that fails (e.g. a network error)
          # would kill the whole probe run.
          CRUMB="$(curl -sS --max-time 45 -b "$COOKIE_JAR" \
                   -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                   "https://query1.finance.yahoo.com/v1/test/getcrumb" 2>/dev/null | head -c 64)" || CRUMB=""
          if [ -n "$CRUMB" ] && ! printf '%s' "$CRUMB" | grep -qiE 'too many|error|invalid'; then
            echo "| getcrumb | query1.finance.yahoo.com/v1/test/getcrumb | \`200\` — crumb obtained |" >> "$REPORT"
            # Step 3: the chart API with cookie + crumb.
            probe_row "chart API (RELIANCE.NS, 5d) with cookie+crumb" \
              "https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=5d&interval=1d&crumb=${CRUMB}" \
              -b "$COOKIE_JAR" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
          else
            echo "| getcrumb | query1.finance.yahoo.com/v1/test/getcrumb | FAILED (429 or blocked — the documented behaviour from some networks) |" >> "$REPORT"
          fi

          echo >> "$REPORT"
          echo "## 4b. Alternate price feeds — Twelve Data and Alpha Vantage" >> "$REPORT"
          echo >> "$REPORT"
          echo "Assesses whether a second feed removes the Yahoo dependency for the" >> "$REPORT"
          echo "Kaggle training set (chart_plan.md §4.0). **The interesting question is" >> "$REPORT"
          echo "not throughput — it is whether two providers agree on the same closes.**" >> "$REPORT"
          echo "A silently-wrong or differently-adjusted series from one feed is an" >> "$REPORT"
          echo "invisible fault; a cross-source disagreement is a loud one." >> "$REPORT"
          echo >> "$REPORT"
          TD_HELPER=".github/scripts/td_probe.py"

          TD_KEY="${{ secrets.TWELVE_DATA_API_KEY }}"
          AV_KEY="${{ secrets.ALPHA_VANTAGE_API_KEY }}"

          if [ -n "$TD_KEY" ]; then
            echo "### Twelve Data — which symbol shape resolves an NSE listing?" >> "$REPORT"
            echo >> "$REPORT"
            echo "Costs 1 credit per call, so this is the first thing to get right." >> "$REPORT"
            echo >> "$REPORT"
            echo "\`AAPL\` and \`INR=X\` are **controls**: they are on every Twelve Data" >> "$REPORT"
            echo "tier including free. If they answer and the NSE shapes do not, the" >> "$REPORT"
            echo "key is valid and the finding is *no NSE coverage on this tier* — which" >> "$REPORT"
            echo "is a different conclusion from a bad key, and the two must not be" >> "$REPORT"
            echo "confused." >> "$REPORT"
            echo >> "$REPORT"
            echo "| Symbol | HTTP | Rows | First close | Provider message |" >> "$REPORT"
            echo "|---|---|---|---|---|"
            TD_WORKING=""
            for TD_SYM in "AAPL" "RELIANCE:NSE" "NSE:RELIANCE" "RELIANCE" "RELIANCE:NS" "NIFTYBEES:NSE" "INR=X"; do
              TD_SAFE="$(echo "$TD_SYM" | tr ':/' '__')"
              TD_OUT="$RUNNER_TEMP/td_${TD_SAFE}.json"
              TD_CODE="$(curl -sS -o "$TD_OUT" -w '%{http_code}' --max-time 40 \
                -H "Authorization: apikey ${TD_KEY}" \
                "https://api.twelvedata.com/time_series?symbol=${TD_SYM}&interval=1day&outputsize=5" 2>/dev/null)" || TD_CODE="failed"
              IFS=$'\x1f' read -r TD_ROWS TD_FIRST TD_MSG \
                < <(python3 "$TD_HELPER" rows "$TD_OUT" 2>/dev/null) || true
              TD_ROWS="${TD_ROWS:-0}"; TD_FIRST="${TD_FIRST:--}"; TD_MSG="${TD_MSG:-ok}"
              echo "| \`${TD_SYM}\` | ${TD_CODE} | ${TD_ROWS} | ${TD_FIRST} | ${TD_MSG} |" >> "$REPORT"
              # Only an NSE-shaped symbol may become the working namespace.
              # AAPL answering would otherwise be recorded as "Indian equities work".
              if [ "$TD_ROWS" -gt 0 ] 2>/dev/null && [ -z "$TD_WORKING" ]; then
                case "$TD_SYM" in
                  *:NSE|*:NS) TD_WORKING="$TD_SYM" ;;
                esac
              fi
              if [ "$TD_ROWS" -gt 0 ] 2>/dev/null; then
                case "$TD_SYM" in
                  *:NSE|*:NS) ;;
                  *) TD_CONTROL_OK="${TD_CONTROL_OK:-}${TD_SYM} " ;;
                esac
              fi
            done
            echo >> "$REPORT"

            if [ -n "$TD_WORKING" ]; then
              echo "**Working namespace: \`${TD_WORKING}\`**" >> "$REPORT"
              echo >> "$REPORT"
              echo "### How much history does a FREE tier actually return?" >> "$REPORT"
              echo >> "$REPORT"
              echo "chart_plan.md assumed \`outputsize=5000\` would be available. Testing" >> "$REPORT"
              echo "rather than trusting the docs, because the training set needs ~2,473" >> "$REPORT"
              echo "bars per symbol and a capped tier cannot supply them." >> "$REPORT"
              echo >> "$REPORT"
              echo "| Outputsize asked | HTTP | Rows | Earliest | Provider message |" >> "$REPORT"
              echo "|---|---|---|---|---|"
              for TD_SIZE in 500 5000; do
                TD_H="$RUNNER_TEMP/td_hist_${TD_SIZE}.json"
                TD_HCODE="$(curl -sS -o "$TD_H" -w '%{http_code}' --max-time 60 \
                  -H "Authorization: apikey ${TD_KEY}" \
                  "https://api.twelvedata.com/time_series?symbol=${TD_WORKING}&interval=1day&outputsize=${TD_SIZE}" 2>/dev/null)" || TD_HCODE="failed"
                IFS=$'\x1f' read -r TD_HROWS TD_HFIRST TD_HMSG \
                  < <(python3 "$TD_HELPER" rows "$TD_H" 2>/dev/null) || true
                TD_HROWS="${TD_HROWS:-0}"; TD_HFIRST="${TD_HFIRST:--}"; TD_HMSG="${TD_HMSG:-ok}"
                TD_EARLIEST="$(python3 -c "import json;v=(json.load(open('${TD_H}')).get('values') or []);print(v[-1]['datetime'][:10] if v else '-')" 2>/dev/null || echo "-")"
                echo "| ${TD_SIZE} | ${TD_HCODE} | ${TD_HROWS} | ${TD_EARLIEST} | ${TD_HMSG} |" >> "$REPORT"
              done
              echo >> "$REPORT"

              echo "### Cross-source agreement — Twelve Data vs Yahoo" >> "$REPORT"
              echo >> "$REPORT"
              echo "Same symbol, same dates, two providers. A close differing by more" >> "$REPORT"
              echo "than a rupee is either a corporate action one feed adjusted and the" >> "$REPORT"
              echo "other did not, or one of them is wrong — and either should be loud." >> "$REPORT"
              echo >> "$REPORT"
              if [ -n "$CRUMB" ] && ! printf '%s' "$CRUMB" | grep -qiE 'too many|error|invalid'; then
                echo "| Symbol | Date | Yahoo close | Twelve Data close | Difference |" >> "$REPORT"
                echo "|---|---|---|---|---|"
                for TD_PAIR in "RELIANCE:NSE" "TCS:NSE" "HDFCBANK:NSE" "INFY:NSE" "BAJFINANCE:NSE"; do
                  TD_BASE="${TD_PAIR%%:*}"
                  TD_SAFE="$(echo "$TD_PAIR" | tr ':' '_')"
                  YJ="$RUNNER_TEMP/y_${TD_SAFE}.json"
                  TJ="$RUNNER_TEMP/t_${TD_SAFE}.json"
                  curl -sS --max-time 45 -o "$YJ" -b "$COOKIE_JAR" \
                    -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
                    "https://query1.finance.yahoo.com/v8/finance/chart/${TD_BASE}.NS?range=1mo&interval=1d&crumb=${CRUMB}" >/dev/null 2>&1 || true
                  curl -sS --max-time 45 -o "$TJ" -H "Authorization: apikey ${TD_KEY}" \
                    "https://api.twelvedata.com/time_series?symbol=${TD_PAIR}&interval=1day&outputsize=30" >/dev/null 2>&1 || true
                  python3 "$TD_HELPER" agree "$YJ" "$TJ" "$TD_PAIR" >> "$REPORT" 2>/dev/null \
                    || echo "| ${TD_PAIR} | — | — | — | comparison failed |" >> "$REPORT"
                done
                echo >> "$REPORT"
                echo "**BAJFINANCE is in this list deliberately.** It had a ~1:10 split" >> "$REPORT"
                echo "inside this repository's own fixture, so it is the bar most likely to" >> "$REPORT"
                echo "expose a difference in \`adjust\` policy. A mismatch there and nowhere" >> "$REPORT"
                echo "else is the adjustment policy differing — which is still worth knowing" >> "$REPORT"
                echo "before it is mistaken for a data fault." >> "$REPORT"
              else
                echo "The Yahoo handshake did not answer, so no cross-source comparison was" >> "$REPORT"
                echo "possible from this run. That is a finding about this network, not about" >> "$REPORT"
                echo "either provider." >> "$REPORT"
              fi
              echo >> "$REPORT"

              echo "### Rate limit — bounded probe, deliberately" >> "$REPORT"
              echo >> "$REPORT"
              echo "**The daily credit cap is not probed, by design.** Finding it would mean" >> "$REPORT"
              echo "deliberately exhausting the key's allowance and leaving the owner unable" >> "$REPORT"
              echo "to use the account until it resets. The per-minute ceiling is found from" >> "$REPORT"
              echo "a short burst instead." >> "$REPORT"
              echo >> "$REPORT"
              BURST_N=12
              BURST_OK=0
              BURST_429=0
              for _ in $(seq 1 "$BURST_N"); do
                BC="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                  -H "Authorization: apikey ${TD_KEY}" \
                  "https://api.twelvedata.com/price?symbol=${TD_WORKING}" 2>/dev/null)" || BC="err"
                if [ "$BC" = "429" ]; then BURST_429=$((BURST_429+1)); else BURST_OK=$((BURST_OK+1)); fi
                sleep 0.4
              done
              echo "| Burst | Result |" >> "$REPORT"
              echo "|---|---|" >> "$REPORT"
              echo "| ${BURST_N} requests in ~${BURST_N}s | ${BURST_OK} answered, ${BURST_429} x HTTP 429 |" >> "$REPORT"
              echo >> "$REPORT"
              if [ "$BURST_429" -gt 0 ]; then
                echo "The per-minute ceiling was reached inside ${BURST_N} requests, so a" >> "$REPORT"
                echo "training run over 451 symbols must pace itself and cache aggressively." >> "$REPORT"
              else
                echo "No 429 inside ${BURST_N} requests. The documented free-tier figure is" >> "$REPORT"
                echo "8 credits per minute; this burst ran under that, so the real ceiling" >> "$REPORT"
                echo "was not located. Absence of a 429 here is not evidence of headroom." >> "$REPORT"
              fi
            else
              echo "**No NSE symbol shape returned rows.**" >> "$REPORT"
              echo >> "$REPORT"
              if [ -n "${TD_CONTROL_OK:-}" ]; then
                echo "The control(s) \`${TD_CONTROL_OK}\` *did* answer, so the API key is" >> "$REPORT"
                echo "valid and authenticated. The finding is therefore **this Twelve Data" >> "$REPORT"
                echo "tier carries no NSE coverage** — not a bad key and not a wrong symbol" >> "$REPORT"
                echo "shape. Twelve Data documents non-US equity coverage as plan-dependent," >> "$REPORT"
                echo "so NSE is very likely a paid add-on." >> "$REPORT"
              else
                echo "The control symbols did not answer either, so **no conclusion about" >> "$REPORT"
                echo "NSE coverage can be drawn from this run** — the key, the tier or the" >> "$REPORT"
                echo "network could all be responsible. This is reported as untested rather" >> "$REPORT"
                echo "than as a negative result." >> "$REPORT"
              fi
              echo >> "$REPORT"
              echo "The history, agreement and rate sections are skipped rather than" >> "$REPORT"
              echo "reported as failures, because there is no NSE symbol to run them on." >> "$REPORT"
            fi
          else
            echo "\`TWELVE_DATA_API_KEY\` is not set on this repository." >> "$REPORT"
          fi
          echo >> "$REPORT"

          if [ -n "$AV_KEY" ]; then
            echo "### Alpha Vantage — free-tier reality check" >> "$REPORT"
            echo >> "$REPORT"
            echo "chart_plan.md §4.0 rules this out on documentation grounds: India" >> "$REPORT"
            echo "coverage is documented as BSE only, \`outputsize=full\` is Premium, and" >> "$REPORT"
            echo "the adjusted endpoint is Premium. This measures whether that holds." >> "$REPORT"
            echo >> "$REPORT"
            echo "| Query | HTTP | Rows | Note |" >> "$REPORT"
            echo "|---|---|---|---|"
            for AV_SYM in "RELIANCE.BSE" "RELIANCE.NS"; do
              AV_J="$RUNNER_TEMP/av_$(echo "$AV_SYM" | tr '.' '_').json"
              AV_CODE="$(curl -sS -o "$AV_J" -w '%{http_code}' --max-time 45 \
                "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${AV_SYM}&apikey=${AV_KEY}" 2>/dev/null)" || AV_CODE="failed"
              AV_ROWS="$(python3 -c "import json;print(len(json.load(open('${AV_J}')).get('Time Series (Daily)') or {}))" 2>/dev/null || echo "-")"
              AV_NOTE="$(python3 -c "import json;d=json.load(open('${AV_J}'));print(next((str(d[k])[:70].replace('|','/') for k in ('Note','Information','Error Message') if k in d),'series returned'))" 2>/dev/null || echo "-")"
              echo "| \`${AV_SYM}\` | ${AV_CODE} | ${AV_ROWS} | ${AV_NOTE} |" >> "$REPORT"
            done
            echo >> "$REPORT"
            echo "A row count near **100** confirms the free tier is capped well below the" >> "$REPORT"
            echo "~2,473 bars the training set needs, and the verdict in chart_plan.md §4.0" >> "$REPORT"
            echo "stands on measurement rather than on documentation." >> "$REPORT"
          else
            echo "\`ALPHA_VANTAGE_API_KEY\` is not set on this repository." >> "$REPORT"
          fi
          echo >> "$REPORT"
          echo "## 5. screener.in — bank-ratio re-check (W4 decision input)" >> "$REPORT"
          echo >> "$REPORT"
          echo "Fetches ONLY the robots-permitted URL shape" >> "$REPORT"
          echo "(\`/company/{SYMBOL}/consolidated/\`), one request, with the" >> "$REPORT"
          echo "required Referer, and greps the returned page for the bank" >> "$REPORT"
          echo "ratio rows the app cannot currently source." >> "$REPORT"
          echo >> "$REPORT"
          HDFC="$RUNNER_TEMP/hdfcbank.html"
          SCREENER_STATUS="$(curl -sS -o "$HDFC" -w '%{http_code}' --max-time 90 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -e "https://www.screener.in/" \
            "https://www.screener.in/company/HDFCBANK/consolidated/" 2>/dev/null)" || SCREENER_STATUS="failed"
          echo "| Page | URL | Result |" >> "$REPORT"
          echo "|---|---|---|" >> "$REPORT"
          echo "| HDFCBANK consolidated | https://www.screener.in/company/HDFCBANK/consolidated/ | ${SCREENER_STATUS} · $(wc -c < "$HDFC" 2>/dev/null || echo 0) bytes |" >> "$REPORT"
          echo >> "$REPORT"
          echo "Bank ratio rows found on the page today:" >> "$REPORT"
          echo >> "$REPORT"
          if [ "$SCREENER_STATUS" = "200" ]; then
            for label in "Net Interest Margin" "Gross NPA" "Net NPA" "CASA" "Provision Coverage" "GNPA" "NNPA" "Stage 2" "Cost of Funds"; do
              # grep exits 1 on no match; with pipefail and the
              # runner's `bash -e` that would kill the run, so the
              # substitution is guarded and an absent label is a
              # clean "0" — which is the answer we want anyway.
              COUNT="$(grep -o -i "$label" "$HDFC" 2>/dev/null | wc -l | tr -d ' ')" || COUNT="0"
              if [ "$COUNT" -gt 0 ]; then
                echo "- ✅ **$label** — present ($COUNT occurrence(s)) → candidate to promote from NOT_SOURCED" >> "$REPORT"
              else
                echo "- ❌ **$label** — absent on this capture" >> "$REPORT"
              fi
            done
          else
            echo "Page not fetchable (status ${SCREENER_STATUS}); re-check required." >> "$REPORT"
          fi

          echo >> "$REPORT"
          echo "## Verdict lines for the plan" >> "$REPORT"
          echo >> "$REPORT"
          echo "- W3 index series: promote the first index URL above that answered **200**;" >> "$REPORT"
          echo "  if none did, relative strength stays honestly unscored and breadth" >> "$REPORT"
          echo "  (computed from the bhavcopy itself) carries the market-pulse card." >> "$REPORT"
          echo "- W4 bank ratios: promote only the labels marked ✅, each pinned to a" >> "$REPORT"
          echo "  new golden fixture before the RatioId leaves NOT_SOURCED." >> "$REPORT"

          # Step summary + artifact.
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          cp "$REPORT" live-probe-report.md

      - name: Upload probe report
        uses: actions/upload-artifact@v5
        with:
          name: live-probe-report
          path: live-probe-report.md
          if-no-files-found: error
          retention-days: 90
